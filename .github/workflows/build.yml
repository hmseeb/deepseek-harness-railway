name: Build and push image

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "template.json", "test/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # An apt layer plus one npm global install; nothing is compiled.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: image
          push: true
          # Railway runs amd64. Building arm64 as well would double the build
          # for nobody.
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/deepseek-harness-railway:0.1.0-rc.7-r2
            ghcr.io/${{ github.repository_owner }}/deepseek-harness-railway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
